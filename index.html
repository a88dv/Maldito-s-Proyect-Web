<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Maldito's</title>
    <link href="https://media.discordapp.net/attachments/1495842789575885000/1496911176460664862/logo_solo.png?ex=69f383ab&is=69f2322b&hm=1ecc8e9e1ead563e0e194f0a744a8adac6deb2779630af482e61cc4c0ab6300b&=&format=webp&quality=lossless" rel="icon" type="image/x-icon">
    <style>
        :root {
            --fondo-oscuro: #0f0f0f;
            --tarjeta-oscuro: #1a1a1a;
            --rojo-logo: #A31D31;
            --texto-blanco: #ffffff;
            --texto-gris: #9ca3af;
            --borde: rgba(255, 255, 255, 0.08);
            --radio: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--fondo-oscuro);
            color: var(--texto-blanco);
            background-image: radial-gradient(circle at 20% 30%, #1a1010 0%, #0f0f0f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            height: 70px;
            padding: 0 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--borde);
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo img { width: 48px; height: 48px; object-fit: contain; }
        .nav-logo h1 { font-size: 22px; letter-spacing: -1px; color: white; }
        .nav-logo em { color: var(--rojo-logo); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .login-card {
            background: var(--tarjeta-oscuro);
            border: 1px solid var(--borde);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-header p {
            color: var(--texto-gris);
            font-size: 14px;
        }

        .field { margin-bottom: 20px; }

        .field label {
            display: block;
            color: var(--texto-gris);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 13px 16px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus { border-color: var(--rojo-logo); }
        .field input::placeholder { color: #444; }

        .field .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .row-extras {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--texto-gris);
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--rojo-logo);
            cursor: pointer;
            width: 15px;
            height: 15px;
        }

        .forgot-link {
            color: var(--rojo-logo);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover { text-decoration: underline; }

        .btn-ingresar {
            width: 100%;
            background: var(--rojo-logo);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
        }

        .btn-ingresar:hover { background: #c02240; }
        .btn-ingresar:active { transform: scale(0.98); }

        .register-row {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--texto-gris);
        }

        .register-row a {
            color: var(--rojo-logo);
            font-weight: 600;
            text-decoration: none;
        }

        .register-row a:hover { text-decoration: underline; }

        .success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 10px 0;
            text-align: center;
            animation: fadeUp 0.3s ease;
        }

        .success-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(163, 29, 49, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 1px solid rgba(163, 29, 49, 0.3);
        }

        .success-view h3 { font-size: 22px; font-weight: 700; }
        .success-view p { color: var(--texto-gris); font-size: 14px; }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--rojo-logo);
            border-radius: 999px;
            width: 0%;
            animation: fillBar 1.6s ease forwards;
        }

        @keyframes fillBar { to { width: 100%; } }

        @media (max-width: 500px) {
            nav { padding: 0 20px; }
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="carrusel.html" class="nav-logo">
            <img src="https://media.discordapp.net/attachments/1495842789575885000/1496911176460664862/logo_solo.png?ex=69f383ab&is=69f2322b&hm=1ecc8e9e1ead563e0e194f0a744a8adac6deb2779630af482e61cc4c0ab6300b&=&format=webp&quality=lossless" alt="Logo Maldito's">
            <h1>maldito<em>'s</em></h1>
        </a>
        <div>
            <a href="carrusel.html" style="color: var(--texto-gris); text-decoration: none; font-size: 14px;">← Volver al inicio</a>
        </div>
    </nav>

    <div class="main">
        <div class="login-card">

            <div id="form-view">
                <div class="card-header">
                    <h2>Bienvenido a Malditos 😈</h2>
                    <p>Ingresa a los Maldito's más activos</p>
                </div>

                <div class="field">
                    <label for="usuario">Usuario o correo</label>
                    <input type="text" id="usuario" placeholder="tu_usuario" autocomplete="username" />
                    <span class="error-msg" id="err-usuario">Por favor ingresa tu usuario o correo.</span>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
                    <span class="error-msg" id="err-password">Por favor ingresa tu contraseña.</span>
                </div>

                <div class="row-extras">
                    <label class="checkbox-label">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button class="btn-ingresar" onclick="handleLogin()">Ingresar →</button>

                <div class="register-row">
                    ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
                </div>
            </div>

            <div class="success-view" id="success-view">
                <div class="success-icon">✓</div>
                <h3>¡Bienvenido!</h3>
                <p>Redirigiendo a la comunidad...</p>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
    function handleLogin() {
        var usuario = document.getElementById('usuario').value.trim();
        var password = document.getElementById('password').value.trim();
        var ok = true;

        // ... (tus validaciones de error)

        if (ok) {
        // ESTA ES LA LÍNEA QUE DEBES AGREGAR:
        localStorage.setItem('usuarioActivo', usuario); 

        document.getElementById('form-view').style.display = 'none';
        var sv = document.getElementById('success-view');
        sv.style.display = 'flex';
        setTimeout(function () {
            window.location.href = 'carrusel.html';
        }, 1800);
    }
}

        document.getElementById('usuario').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('password').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>
</html>
